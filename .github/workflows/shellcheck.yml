name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check tracked shell scripts
        shell: bash
        run: |
          shell_files=()
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            if head -n 1 "$file" | grep -Eq '^#!.*(ba|da|k|z)?sh([[:space:]]|$)'; then
              shell_files+=("$file")
            fi
          done < <(git ls-files)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked shell scripts found."
            exit 0
          fi

          printf 'Checking %s shell scripts...\n' "${#shell_files[@]}"
          shellcheck "${shell_files[@]}"

  ruby-tests:
    name: Ruby and installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master, 2026-08-18
        with:
          ruby-version: "3.4"
      - name: Install rcm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rcm
      - name: Install rcm (macOS)
        if: runner.os == 'macOS'
        run: brew install rcm
      - name: Run Ruby suites and consistency checks
        run: make verify SYSTEM_RUBY=ruby
      - name: Verify isolated-home installation and idempotency
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ruby ./install --profile core --skip-packages --yes
          HOME="$test_home" ruby ./install --profile core --skip-packages --yes
          test -L "$test_home/.zshrc"
          test -L "$test_home/.gitconfig"
          test -L "$test_home/.agents/skills/ruby-on-rails-dev/SKILL.md"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
