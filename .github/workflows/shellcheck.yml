name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check tracked shell scripts
        shell: bash
        run: |
          shell_files=()
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            if head -n 1 "$file" | grep -Eq '^#!.*(ba|da|k|z)?sh([[:space:]]|$)'; then
              shell_files+=("$file")
            fi
          done < <(git ls-files)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked shell scripts found."
            exit 0
          fi

          printf 'Checking %s shell scripts...\n' "${#shell_files[@]}"
          shellcheck "${shell_files[@]}"

  skill-cli:
    name: Skill CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Run tests
        run: make -C skill test SYSTEM_RUBY=ruby
